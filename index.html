<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193d31">
  <meta name="description" content="Splitly — a thoughtful, multilingual tip and bill-splitting calculator. No downloads, no sign-up.">
  <title>Splitly · 轻松分账</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  <style>
:root {
  --paper:#f5f4ec;
  --ink:#203e33;
  --muted:#727b6e;
  --forest:#193d31;
  --lime:#d5ef89;
  --line:#e5e8dd;
  --red:#aa3c2f;
  --font:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-family:var(--font);
  color:var(--ink);
  background:var(--paper);
  font-synthesis:none
}

* {
  box-sizing:border-box
}

body {
  margin:0
}

button,input,select,textarea {
  font:inherit
}

button,select {
  cursor:pointer
}

button,a,input,select,textarea {
  -webkit-tap-highlight-color:transparent
}

button {
  color:inherit
}

button:disabled {
  cursor:not-allowed;
  opacity:.45
}

button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:3px solid #9caf61;
  outline-offset:4px
}

svg {
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0
}

button {
  border:0
}

h1,h2,p,dl,dd {
  margin:0
}

[hidden] {
  display:none!important
}

.page-shell {
  max-width:1136px;
  margin:0 auto;
  padding:0 36px
}

.select-wrap {
  position:relative;
  display:flex;
  align-items:center
}

.select-wrap:after {
  content:"";
  position:absolute;
  right:13px;
  top:calc(50% - 4px);
  width:6px;
  height:6px;
  border-right:1.5px solid;
  border-bottom:1.5px solid;
  transform:rotate(45deg);
  pointer-events:none
}

.select-wrap select {
  appearance:none;
  color:var(--ink);
  border:1px solid #dce1d2;
  border-radius:9px;
  background:transparent;
  height:41px;
  padding:0 32px 0 14px;
  font-size:12px;
  font-weight:550
}

.language-select svg {
  position:absolute;
  left:12px;
  width:16px;
  height:16px;
  pointer-events:none
}

.language-select select {
  padding-left:36px;
  min-width:132px
}

.intro {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:36px 0 28px;
  gap:32px
}

.intro-copy {
  min-width:0
}

.intro .language-select {
  flex-shrink:0
}

.eyebrow {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:10px;
  letter-spacing:2.5px;
  font-weight:650;
  margin-bottom:17px
}

.eyebrow>span:first-child {
  width:7px;
  height:7px;
  background:#b98554;
  border-radius:50%
}

h1 {
  position:relative;
  font-size:46px;
  font-weight:650;
  letter-spacing:-1.6px;
  line-height:1.25
}

h1 em {
  font-style:normal;
  color:#7b8d51
}

.intro-description {
  font-size:13px;
  line-height:1.9;
  color:#6c7767;
  max-width:490px;
  margin-top:16px;
  letter-spacing:.1px
}

.calculator {
  display:grid;
  grid-template-columns:1.1fr 1fr;
  background:#fff;
  border:1px solid #e4e7dd;
  border-radius:24px;
  padding:9px;
  box-shadow:0 18px 50px -26px #33452e26;
  align-items:stretch
}

.input-panel {
  padding:25px 30px 18px 24px;
  min-width:0
}

.panel-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:30px
}

h2 {
  font-size:16px;
  font-weight:650;
  letter-spacing:-.3px
}

.text-button {
  display:flex;
  align-items:center;
  gap:5px;
  background:transparent;
  font-size:11px;
  color:#697858;
  padding:7px 0
}

.text-button svg {
  width:12px;
  height:12px;
  fill:currentColor;
  stroke-width:1.2
}

.text-button:hover {
  color:#304f22
}

.field-group {
  border:0;
  padding:0;
  margin:0 0 20px;
  min-width:0
}

.field-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:11px;
  width:100%;
  font-size:12px;
  font-weight:600
}

.field-heading label {
  display:flex;
  align-items:center;
  gap:9px
}

.step {
  font-size:10px;
  color:#869276;
  font-weight:500;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px
}

.field-caption {
  font-size:10px;
  font-weight:400;
  color:var(--muted)
}

.money-input {
  display:flex;
  align-items:center;
  gap:11px;
  background:#f8f9f4;
  border:1px solid #e2e7d9;
  border-radius:10px;
  height:65px;
  padding:0 16px;
  transition:border-color .15s,box-shadow .15s
}

.money-input>span:first-child {
  font-size:17px;
  color:#76816a;
  font-weight:500
}

.money-input input {
  width:100%;
  min-width:0;
  padding:8px 0;
  border:0;
  background:transparent;
  font-size:29px;
  font-weight:550;
  letter-spacing:-.7px;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  outline:none
}

.money-input:focus-within,.custom-input:focus-within,.stepper:focus-within {
  border-color:#8d9e5a;
  box-shadow:0 0 0 3px #a8b8741a
}

.input-currency {
  font-size:10px;
  letter-spacing:1px;
  color:#7a846e
}

.currency-setting {
  display:grid;
  grid-template-columns:1fr minmax(150px,1fr);
  align-items:center;
  gap:8px 16px;
  margin-top:12px;
  padding:12px 14px;
  background:#f0f4e6;
  border:1px solid #e1e8d3;
  border-radius:10px
}

.currency-setting>label {
  font-size:13px;
  font-weight:600
}

.currency-setting .currency-select select {
  width:100%;
  min-height:44px;
  padding:0 34px 0 14px;
  background:#fff;
  border-color:#c5d2b2;
  font-size:14px;
  font-weight:600
}

.currency-setting p {
  grid-column:1 / -1;
  font-size:10px;
  line-height:1.6;
  color:#667355
}

.money-input input:focus-visible,.custom-input input:focus-visible,.stepper input:focus-visible {
  outline:none
}

.money-input input::placeholder {
  color:#adb6a3
}

.tip-fieldset legend {
  justify-content:flex-start;
  gap:9px;
  padding:0
}

.tip-fieldset .tip-select select {
  width:100%;
  height:46px;
  padding:0 36px 0 16px;
  background:#f7f8f2;
  border-color:#dce4d1;
  font-size:15px;
  font-weight:600
}

.custom-tip-row {
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  margin-top:12px;
  font-size:11px;
  color:#6c7767
}

.custom-input {
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid #e2e7d9;
  background:#f8f9f4;
  border-radius:8px;
  padding:0 12px;
  height:40px;
  width:120px
}

.custom-input input {
  min-width:0;
  width:100%;
  border:0;
  background:transparent;
  color:var(--ink);
  text-align:right;
  font-size:17px;
  outline:none
}

.field-error {
  font-size:11px;
  line-height:1.5;
  color:var(--red);
  margin-top:6px;
  min-height:0
}

.field-error:empty {
  display:none
}

.money-input.invalid,.stepper.invalid,.custom-input.invalid {
  border-color:var(--red);
  background:#fff8f6
}

.people-group {
  margin-bottom:25px
}

.people-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px
}

.people-description {
  display:flex;
  gap:9px;
  align-items:center;
  color:#77816c;
  font-size:12px
}

.people-description svg {
  width:21px;
  height:21px
}

.stepper {
  display:flex;
  align-items:center;
  height:44px;
  border:1px solid #e2e7d9;
  border-radius:9px;
  overflow:visible;
  background:#f8f9f4
}

.stepper button {
  width:39px;
  height:40px;
  background:transparent;
  font-size:21px;
  color:#6c7d56;
  border-radius:8px
}

.stepper button:hover:not(:disabled) {
  background:#e9efdc
}

.stepper input {
  background:transparent;
  border:0;
  outline:0;
  text-align:center;
  width:52px;
  font-size:17px;
  color:var(--ink);
  font-weight:600;
  padding:0;
  font-variant-numeric:tabular-nums
}

.form-actions {
  display:flex;
  gap:15px
}

.calculate-button {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  min-height:46px;
  flex:1;
  background:var(--lime);
  color:#25422d;
  font-weight:650;
  font-size:13px;
  border-radius:9px;
  padding:10px 18px;
  transition:background .15s,transform .15s
}

.calculate-button:hover {
  background:#c8e578;
  transform:translateY(-1px)
}

.calculate-button svg {
  width:17px;
  height:17px
}

.reset-button {
  background:transparent;
  font-size:11px;
  color:#6c7960;
  padding:8px 9px
}

.reset-button:hover {
  text-decoration:underline
}

.input-note {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:10px;
  color:#8b927e;
  margin-top:12px
}

.input-note svg {
  width:10px;
  height:12px;
  fill:#8b927e;
  stroke:0
}

.result-panel {
  position:relative;
  overflow:hidden;
  min-width:0;
  background:var(--forest);
  color:#fff;
  border-radius:17px;
  padding:27px 30px 20px;
  display:flex;
  flex-direction:column
}

.result-panel:before {
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:1px solid #ffffff05;
  border-radius:50%;
  top:-100px;
  right:-80px;
  pointer-events:none;
  box-shadow:0 0 0 28px #ffffff02,0 0 0 56px #ffffff02
}

.receipt-heading {
  display:flex;
  gap:9px;
  align-items:center;
  position:relative
}

.receipt-heading h2 {
  font-size:12px;
  color:#dce8d6;
  font-weight:500;
  letter-spacing:.4px
}

.receipt-icon {
  display:flex;
  align-items:center;
  color:#b4c5ab
}

.receipt-icon svg {
  width:17px;
  height:17px
}

.receipt-currency {
  margin-left:auto;
  font-size:9px;
  letter-spacing:1.4px;
  border:1px solid #81987d4a;
  border-radius:5px;
  padding:4px 7px;
  color:#bbcbb1
}

.per-person-block {
  padding:28px 0 25px
}

.per-person-block>p {
  font-size:12px;
  color:#bacdb4;
  margin-bottom:8px
}

.amount-line {
  display:flex;
  align-items:baseline;
  gap:9px;
  color:var(--lime);
  white-space:nowrap
}

.amount-symbol {
  font-size:23px;
  font-weight:400;
  letter-spacing:-1px
}

.amount-line output {
  font-size:clamp(42px,5vw,62px);
  font-weight:500;
  font-variant-numeric:tabular-nums;
  letter-spacing:-3px;
  line-height:1.2;
  overflow-wrap:anywhere;
  min-width:0
}

.amount-line.compact output {
  font-size:32px;
  letter-spacing:-1px
}

.amount-line.compact .amount-symbol {
  font-size:18px
}

.included-badge {
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:5px;
  padding:5px 7px;
  margin-top:13px;
  background:#ffffff08;
  font-size:9px;
  color:#c0d3ad
}

.included-badge>span:first-child {
  color:var(--lime)
}

.receipt-lines {
  border-top:1px dashed #8ca68450;
  padding-top:19px
}

.receipt-lines>div {
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:baseline;
  margin-bottom:13px;
  font-size:12px
}

.receipt-lines dt {
  color:#b3c6ac
}

.receipt-lines dd {
  font-weight:500;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
  text-align:right
}

.rate-tag {
  font-size:9px;
  color:#cfe2b4;
  margin-left:5px
}

.receipt-lines .total-line {
  border-top:1px solid #8ca68430;
  padding-top:14px;
  margin-top:16px;
  font-size:14px
}

.total-line dt {
  color:#e4ecdd
}

.receipt-lines .split-line {
  font-size:11px;
  margin-bottom:0
}

.split-line dd {
  color:#bfd0b4
}

.rounding-note {
  font-size:9px;
  color:#aec3a5;
  line-height:1.7;
  margin:12px 0 17px;
  min-height:16px
}

.copy-button {
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:42px;
  border-radius:8px;
  background:#ffffff08;
  border:1px solid #92aa8052;
  color:#e1ebd6;
  font-size:11px;
  transition:background .15s
}

.copy-button:hover:not(:disabled) {
  background:#ffffff14
}

.copy-button svg {
  width:13px;
  height:13px
}

.receipt-footer {
  display:flex;
  align-items:center;
  gap:6px;
  color:#b7c9ac;
  font-size:9px;
  padding-top:15px;
  line-height:1.5
}

.status-dot {
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--lime);
  flex-shrink:0
}

.receipt-footer>span:last-child {
  margin-left:auto;
  font-size:17px;
  color:#9db77d
}

.below-calculator {
  display:flex;
  justify-content:center;
  gap:12px;
  color:#7d8573;
  font-size:10px;
  padding:18px 7px
}

.below-calculator p:last-child {
  display:flex;
  align-items:center;
  gap:5px
}

.below-calculator svg {
  width:13px;
  height:13px
}

.site-footer {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border-top:1px solid #dfe3d7;
  padding:23px 0;
  margin-top:29px;
  font-size:10px;
  color:#8b927e
}

.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0
}

.toast {
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  max-width:90vw;
  z-index:20;
  background:#193d31;
  color:#e6f1dc;
  padding:14px 22px;
  border-radius:12px;
  box-shadow:0 8px 30px #193d3133;
  font-size:13px;
  line-height:1.6
}

dialog {
  border:1px solid #e2e7d9;
  border-radius:20px;
  padding:25px;
  max-width:440px;
  width:calc(100% - 32px);
  color:var(--ink);
  box-shadow:0 20px 100px #193d3150
}

dialog::backdrop {
  background:#193d3177;
  backdrop-filter:blur(3px)
}

.dialog-heading {
  display:flex;
  justify-content:space-between;
  align-items:center
}

.dialog-close {
  font-size:25px;
  background:none;
  width:36px;
  height:36px;
  border-radius:5px
}

dialog p {
  font-size:13px;
  margin:10px 0 15px;
  color:var(--muted)
}

dialog textarea {
  width:100%;
  height:215px;
  resize:vertical;
  border:1px solid #d7dfcc;
  border-radius:8px;
  padding:14px;
  background:#f8f9f4;
  color:var(--ink);
  line-height:1.7;
  margin-bottom:12px
}

dialog .calculate-button {
  width:100%
}

.noscript-note {
  text-align:center;
  padding:20px;
  color:var(--red)
}

html[lang="en"] h1 {
  font-family:Georgia,"Times New Roman",serif;
  font-size:52px;
  font-weight:400;
  letter-spacing:-1.8px;
  line-height:1.1
}

html[lang="en"] h1 em {
  font-style:italic
}

html[lang="en"] .intro-description {
  max-width:490px
}

html[lang="ja"] h1 {
  font-size:40px
}

@media(min-width:1300px) {
  .intro {
    padding-top:40px;
    padding-bottom:30px
  }
}

@media(max-width:850px) {
  .page-shell {
    padding:0 25px
  }
  .input-panel {
    padding:23px 22px 18px 15px
  }
  .result-panel {
    padding:25px 23px 20px
  }
  .intro-description {
    font-size:12px
  }
  h1 {
    font-size:40px
  }
  html[lang="en"] h1 {
    font-size:45px
  }
  .amount-line output {
    font-size:48px
  }
  .amount-symbol {
    font-size:20px
  }
  .amount-line.compact output {
    font-size:27px
  }
.custom-option {
    font-size:10px
  }
  .intro {
    gap:20px
  }
}

@media(max-width:680px) {
  .page-shell {
    max-width:540px;
    padding:0 20px
  }
  .select-wrap select {
    font-size:10px;
    height:35px;
    padding-left:10px;
    padding-right:25px
  }
  .select-wrap:after {
    right:10px;
    width:5px;
    height:5px
  }
  .language-select select {
    padding-left:28px;
    min-width:108px
  }
  .language-select svg {
    left:9px;
    width:13px;
    height:13px
  }
  .intro {
    flex-direction:column;
    gap:18px;
    padding:20px 0 25px
  }
  .intro .language-select {
    order:-1;
    align-self:flex-end
  }
  .eyebrow {
    font-size:9px;
    margin-bottom:14px
  }
  h1 {
    font-size:38px;
    line-height:1.2;
    letter-spacing:-1px
  }
  .intro-description {
    max-width:310px;
    margin:16px 0 0;
    font-size:12px;
    line-height:1.8
  }
  html[lang="en"] h1 {
    font-size:43px
  }
  html[lang="en"] .intro-description {
    max-width:330px
  }
  html[lang="ja"] h1 {
    font-size:34px
  }
  .calculator {
    grid-template-columns:1fr;
    padding:7px;
    border-radius:20px
  }
  .input-panel {
    padding:20px 17px 22px
  }
  .panel-heading {
    margin-bottom:25px
  }
  .result-panel {
    padding:25px 24px 20px;
    border-radius:14px
  }
  .field-group {
    margin-bottom:22px
  }
  .amount-line output {
    font-size:58px
  }
  .amount-line.compact output {
    font-size:32px
  }
  .amount-symbol {
    font-size:24px
  }
  .per-person-block {
    padding:25px 0 23px
  }
  .receipt-lines>div {
    font-size:13px
  }
  .rounding-note {
    margin-bottom:20px
  }
  .below-calculator {
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:17px 0;
    font-size:9px
  }
  .site-footer {
    margin-top:15px;
    padding:20px 0;
    font-size:9px;
    gap:12px
  }
  .copy-button {
    min-height:46px
  }
.custom-option {
    font-size:11px
  }
  .form-actions {
    gap:13px
  }
  .calculate-button {
    min-height:48px
  }
}

@media(max-width:360px) {
  .page-shell {
    padding:0 13px
  }
  .language-select select {
    min-width:98px;
    padding-left:25px
  }
  .select-wrap select {
    font-size:9px
  }
  .currency-setting {
    grid-template-columns:1fr minmax(130px,1.3fr);
    gap:8px;
    padding:10px
  }
  .input-panel {
    padding-left:13px;
    padding-right:13px
  }
  .result-panel {
    padding-left:20px;
    padding-right:20px
  }
.custom-option {
    font-size:10px
  }
  h1 {
    font-size:35px
  }
  html[lang="en"] h1 {
    font-size:39px
  }
  html[lang="ja"] h1 {
    font-size:30px
  }
  .amount-line.compact output {
    font-size:27px
  }
  .amount-line.compact .amount-symbol {
    font-size:15px
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    transition:none!important;
    animation:none!important;
    scroll-behavior:auto!important
  }
}

  <script src="calculator.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- input for bill amount, dropdown for tip percent 10 15 20, number of people, a Calculate button, and a result area -->
  <div class="page-shell">
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy"><p class="eyebrow"><span></span><span data-i18n="eyebrow">把时间留给相聚</span></p><h1 id="page-title"><span data-i18n="headline1">好好相聚，</span><br><em data-i18n="headline2">轻松分账。</em></h1><p class="intro-description" data-i18n="intro">从一杯咖啡到一桌晚餐。小费、总额、每人应付，一次算清。</p></div>
        <label class="select-wrap language-select"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z"/></svg><span class="sr-only" data-i18n="language">语言</span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select></label>
      </section>
      <section class="calculator" aria-label="Tip calculator" id="calculator">
        <form id="tip-form" class="input-panel" novalidate>
          <div class="panel-heading"><h2 data-i18n="billDetails">Tip Calculator</h2><button class="text-button" type="button" id="sample-button"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="m7 4 7 6-7 6Z"/></svg><span data-i18n="tryExample">试用示例</span></button></div>
          <div class="field-group">
            <div class="field-heading"><label for="bill"><span class="step">01</span><span data-i18n="billAmount">账单金额</span></label><span class="field-caption" data-i18n="beforeTip">未含小费</span></div>
            <div class="money-input" id="bill-wrap"><span id="input-symbol" aria-hidden="true">HK$</span><input id="bill" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.00" value="80.00" aria-describedby="bill-error"><span class="input-currency" id="input-currency">HKD</span></div>
            <p class="field-error" id="bill-error" aria-live="polite"></p>
            <div class="currency-setting">
              <label for="currency" data-i18n="currency">币种</label>
              <div class="select-wrap currency-select"><select id="currency" aria-describedby="currency-note"><option value="HKD">HKD · HK$</option><option value="CNY">CNY · ¥</option><option value="USD">USD · $</option><option value="EUR">EUR · €</option><option value="GBP">GBP · £</option></select></div>
              <p id="currency-note" data-i18n="currencyNote">币种仅用于显示，不进行汇率换算。</p>
            </div>
          </div>
          <fieldset class="field-group tip-fieldset">
            <legend class="field-heading"><span class="step">02</span><label for="tip-select" data-i18n="chooseTip">小费比例</label></legend>
            <div class="select-wrap tip-select"><select id="tip-select" aria-controls="custom-tip-row"><option value="0">0%</option><option value="10">10%</option><option value="15" selected>15%</option><option value="20">20%</option><option value="custom" data-i18n="custom">自定义</option></select></div>
            <div id="custom-tip-row" class="custom-tip-row" hidden><label for="custom-tip" data-i18n="customTip">自定义比例</label><div class="custom-input"><input id="custom-tip" type="text" inputmode="decimal" autocomplete="off" placeholder="18" aria-describedby="tip-error"><span aria-hidden="true">%</span></div></div>
            <p class="field-error" id="tip-error" aria-live="polite"></p>
          </fieldset>
          <div class="field-group people-group">
            <div class="field-heading"><label for="people"><span class="step">03</span><span data-i18n="splitBetween">一起分账</span></label></div>
            <div class="people-row"><div class="people-description"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></svg><span data-i18n="peopleLabel">用餐人数</span></div><div class="stepper" id="people-wrap"><button id="minus" type="button" aria-label="减少人数">−</button><input id="people" type="text" inputmode="numeric" autocomplete="off" value="3" aria-describedby="people-error"><button id="plus" type="button" aria-label="增加人数">+</button></div></div>
            <p class="field-error" id="people-error" aria-live="polite"></p>
          </div>
          <div class="form-actions"><button type="submit" class="calculate-button"><span data-i18n="calculate">算一下</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><button type="button" class="reset-button" id="reset-button" data-i18n="reset">重置</button></div>
          <p class="input-note"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="m9 1-6 8h4l-1 6 7-9H9Z"/></svg><span data-i18n="liveNote">修改数值，即时更新结果</span></p>
        </form>
        <aside class="result-panel" aria-labelledby="result-title">
          <div class="receipt-heading"><span class="receipt-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg></span><h2 id="result-title" data-i18n="yourSplit">你的分账单</h2><span class="receipt-currency" id="receipt-currency">HKD</span></div>
          <div class="per-person-block"><p data-i18n="eachPays">每人应付</p><div class="amount-line"><span class="amount-symbol" id="result-symbol">HK$</span><output id="per-person" for="bill people custom-tip">30.67</output></div><span class="included-badge"><span aria-hidden="true">↗</span><span data-i18n="tipIncluded">已包含小费</span></span></div>
          <dl class="receipt-lines"><div><dt data-i18n="originalBill">账单金额</dt><dd id="bill-result">HK$80.00</dd></div><div><dt><span data-i18n="tipTotal">小费</span> <span id="tip-rate" class="rate-tag">15%</span></dt><dd id="tip-result">HK$12.00</dd></div><div class="total-line"><dt data-i18n="totalBill">合计</dt><dd id="total-result">HK$92.00</dd></div><div class="split-line"><dt data-i18n="splitCount">平分人数</dt><dd id="people-result">3 人</dd></div></dl>
          <p class="rounding-note" id="rounding-note"></p>
          <button class="copy-button" id="copy-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></svg><span data-i18n="copySummary">复制账单</span></button>
          <div class="receipt-footer"><span class="status-dot"></span><span id="result-status" data-i18n="ready">账目清楚，相聚尽兴。</span><span aria-hidden="true">✳</span></div>
          <p class="sr-only" id="calculation-announcement" role="status" aria-live="polite" aria-atomic="true"></p>
        </aside>
      </section>
      <div class="below-calculator"><p><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M10 2 3 5v5c0 4 7 8 7 8s7-4 7-8V5Z"/><path d="m7 10 2 2 4-4"/></svg><span data-i18n="privacy">本地计算，账单不上传</span></p></div>
    </main>
    <footer class="site-footer"><span>© <span id="year">2026</span></span><span data-i18n="footer">少一点计算，多一点好时光。</span></footer>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="copy-dialog"><form method="dialog"><div class="dialog-heading"><h2 data-i18n="summaryTitle">账单摘要</h2><button class="dialog-close" aria-label="关闭" value="close">×</button></div><p data-i18n="copyManually">请选中并复制以下内容。</p><textarea id="copy-text" readonly aria-label="账单摘要"></textarea><button class="calculate-button" value="close" data-i18n="done">完成</button></form></dialog>
  <noscript><p class="noscript-note">请启用 JavaScript 以使用计算器。 Please enable JavaScript to use the calculator.</p></noscript>
</body>
</html>
